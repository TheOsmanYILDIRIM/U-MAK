name: Godot playable acceptance
on:
  push:
    branches: [main, 'game/godot-*']
    paths: ['game/godot/**', '.github/workflows/godot.yml']
  pull_request:
    paths: ['game/godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
env:
  GODOT_VERSION: 4.5.2
  GODOT_SILENCE_ROOT_WARNING: 1
jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Godot editor
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          echo "GODOT=/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Core, 4-peer ENet, touch UI and actual screenshots
        env:
          UCMAK_REPORTS: ${{ github.workspace }}/build/reports
          LIBGL_ALWAYS_SOFTWARE: 1
        run: python3 game/godot/tests/ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-acceptance-${{ github.sha }}
          path: build/reports
          if-no-files-found: error
  export:
    needs: acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Editor, templates and Android prerequisites
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          echo "GODOT=/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fL --retry 3 -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo 'ea50e5183f057d42b22120d0d0340205b98f51f8ff13c33c70fd4ac9077d2019  /tmp/templates.tpz' | sha256sum -c -
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST" "$HOME/.android" build
          unzip -jo /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/linux_debug.x86_64' 'templates/linux_release.x86_64' 'templates/version.txt' -d "$DEST"
          rm /tmp/templates.tpz
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=Ucmak Debug,O=Ucmak,C=TR'
          mkdir -p "$HOME/.config/godot"
          python3 - <<'PY'
          import os, pathlib
          p=pathlib.Path.home()/'.config/godot/editor_settings-4.5.tres'
          p.write_text('[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "'+os.environ['ANDROID_HOME']+'"\nexport/android/java_sdk_path = "'+os.environ['JAVA_HOME']+'"\nexport/android/debug_keystore = "'+str(pathlib.Path.home()/'.android/debug.keystore')+'"\n')
          PY
      - name: Native Android and Linux exports
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --path game/godot --quit
          "$GODOT" --headless --path game/godot --export-debug Android "$GITHUB_WORKSPACE/build/Ucmak-v0.4-android.apk" 2>&1 | tee build/android-export.log
          test -s build/Ucmak-v0.4-android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/Ucmak-v0.4-android.apk | tee build/apk-signature.txt
          "$GODOT" --headless --path game/godot --export-release Linux "$GITHUB_WORKSPACE/build/Ucmak-v0.4.x86_64" 2>&1 | tee build/linux-export.log
          test -s build/Ucmak-v0.4.x86_64
          chmod +x build/Ucmak-v0.4.x86_64
          timeout 20 build/Ucmak-v0.4.x86_64 --headless --quit-after 40 2>&1 | tee build/export-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error' build/*export.log build/export-smoke.log; then exit 1; fi
          zip -j build/Ucmak-v0.4-linux.zip build/Ucmak-v0.4.x86_64
          git archive --format=zip -o build/Ucmak-v0.4-source.zip HEAD
          sha256sum build/*.apk build/*.zip > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ucmak-playable-${{ github.sha }}
          path: |
            build/*.apk
            build/*.zip
            build/*.txt
            build/*.log
          if-no-files-found: error
  prerelease:
    if: github.event_name == 'push'
    needs: [acceptance, export]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ github.sha }}'
          path: release
          merge-multiple: true
      - name: Publish this verified build as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "ucmak-0.4-${GITHUB_RUN_NUMBER}" --target "$GITHUB_SHA" --prerelease --title "UÇMAK 0.4 · Godot playable build ${GITHUB_RUN_NUMBER}" --notes 'Native Android debug APK and Linux build. Core, four-process ENet, touch UI and screenshots tested in GitHub Actions. Physical phone performance and public internet matchmaking are not yet validated.' release/*.apk release/*.zip release/*.png release/SHA256SUMS.txt release/acceptance.json
